name: pr-rules

# 브랜치 이름과 Closes # 누락을 머지 전에 잡아 줍니다.
# develop -> main 배포 PR은 이 검사를 건너뜁니다.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 브랜치 이름과 이슈 연결 확인
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" = "develop" ]; then
            echo "develop -> main 배포 PR이라 검사를 건너뜁니다."
            exit 0
          fi
          fail=0
          if ! echo "$HEAD" | grep -Eq '^(feat|fix|refactor|docs|chore)/[0-9]+-[a-z0-9-]+$'; then
            echo "::error::브랜치 이름이 규칙과 다릅니다: $HEAD (예: feat/12-refund-api, 숫자는 이슈 번호)"
            fail=1
          fi
          if ! echo "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+'; then
            echo "::error::PR 본문에 'Closes #이슈번호'가 없습니다."
            fail=1
          fi
          exit $fail
