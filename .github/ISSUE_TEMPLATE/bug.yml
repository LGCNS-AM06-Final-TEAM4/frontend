name: 버그
description: 동작이 기대와 다를 때 등록합니다
title: "[WBS번호] 버그 요약"
labels: ["bug"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: 증상
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: "1. \n2. \n3. "
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
  - type: textarea
    id: logs
    attributes:
      label: 로그나 스크린샷
